services:
  tidyfacility:
    build:
      context: .
      dockerfile: Dockerfile
    image: tidyfacility-site:latest
    container_name: tidyfacility-site
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://tidyfacility.com
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
